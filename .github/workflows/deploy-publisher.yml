name: Deploy Publisher

on:
  push:
    branches:
      - main
    paths:
      - 'apps/publisher/**'
      - 'libs/api-client/**'
      - '.github/workflows/deploy-publisher.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write # Required for OIDC authentication with AWS

env:
  NODE_VERSION: '20'
  # AWS Configuration - Set these in GitHub repository secrets/variables
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  S3_BUCKET: ${{ vars.PUBLISHER_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.PUBLISHER_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  check-affected:
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.check.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Check if publisher is affected
        id: check
        run: |
          AFFECTED=$(npx nx show projects --affected --base=HEAD~1 --head=HEAD)
          if echo "$AFFECTED" | grep -q "publisher"; then
            echo "is_affected=true" >> $GITHUB_OUTPUT
            echo "Publisher is affected by changes"
          else
            echo "is_affected=false" >> $GITHUB_OUTPUT
            echo "Publisher is NOT affected by changes"
          fi

  build:
    needs: check-affected
    if: needs.check-affected.outputs.is_affected == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Build publisher
        run: npx nx build publisher

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publisher-dist
          path: apps/publisher/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: publisher-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          # Upload index.html and JSON files with no-cache
          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          # Upload any JSON files (like manifest) with shorter cache
          if ls dist/*.json 1> /dev/null 2>&1; then
            for file in dist/*.json; do
              aws s3 cp "$file" "s3://${{ env.S3_BUCKET }}/$(basename $file)" \
                --cache-control "public, max-age=0, must-revalidate"
            done
          fi

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
