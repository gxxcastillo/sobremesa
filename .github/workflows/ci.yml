name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Check formatting
        run: bun nx-cloud record -- bun nx format:check

      - name: Run CI tasks
        run: bun nx affected -t lint test build types

      - name: Nx Cloud fix CI
        run: bun nx-cloud fix-ci
        if: always()

  # Build each deployable image so a broken Dockerfile or bundle fails CI
  # instead of the next deploy (the API image went unbuildable for weeks
  # unnoticed). Deploy only runs after CI succeeds, so this also gates it.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, chatbots]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.app }} image
        run: docker build -f apps/${{ matrix.app }}/Dockerfile .
