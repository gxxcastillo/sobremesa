name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ci:
        description: 'Run CI checks'
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Run CI
        run: bun nx affected -t lint test build types

  check-affected:
    needs: [ci]
    if: |
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      chatbots: ${{ steps.affected.outputs.chatbots }}
      db: ${{ steps.affected.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # This workflow only ever runs on workflow_run (or manual dispatch), so
      # look up the last successful run by that event. The default ('push')
      # never matches, and the fallback diffs HEAD~1 only -- a multi-commit
      # push then deploys nothing unless its last commit touched an app.
      - uses: nrwl/nx-set-shas@v4
        id: nx-shas
        with:
          last-successful-event: workflow_run

      - name: Determine affected projects
        id: affected
        run: |
          # Fallback: if no base SHA, deploy all
          if [ -z "$NX_BASE" ] || [ "$NX_BASE" = "$NX_HEAD" ]; then
            echo "No base SHA - deploying all"
            {
              echo "api=true"
              echo "chatbots=true"
              echo "db=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AFFECTED=$(bun nx show projects --affected --json 2>/dev/null | jq -r '.[]' 2>/dev/null || echo "")

          API=$(echo "$AFFECTED" | grep -q "^api$" && echo "true" || echo "false")
          CHATBOTS=$(echo "$AFFECTED" | grep -q "^chatbots$" && echo "true" || echo "false")
          DB=$(echo "$AFFECTED" | grep -q "^db$" && echo "true" || echo "false")

          {
            echo "api=$API"
            echo "chatbots=$CHATBOTS"
            echo "db=$DB"
          } >> "$GITHUB_OUTPUT"

          echo "Affected: api=$API chatbots=$CHATBOTS db=$DB"

  # The optional `ci` job is skipped on every workflow_run, and GitHub
  # skips a job whose dependency chain contains a skipped job unless its
  # condition uses a status function -- so without `!cancelled()` these
  # deploy jobs never run on their own, whatever check-affected says.
  deploy-api:
    needs: check-affected
    if: ${{ !cancelled() && needs.check-affected.result == 'success' && fromJSON(needs.check-affected.outputs.api) }}
    uses: ./.github/workflows/deploy-api.yml
    with:
      run_ci: false
    secrets: inherit

  deploy-chatbots:
    needs: check-affected
    if: ${{ !cancelled() && needs.check-affected.result == 'success' && fromJSON(needs.check-affected.outputs.chatbots) }}
    uses: ./.github/workflows/deploy-chatbots.yml
    with:
      run_ci: false
    secrets: inherit

  deploy-db:
    needs: check-affected
    if: ${{ !cancelled() && needs.check-affected.result == 'success' && fromJSON(needs.check-affected.outputs.db) }}
    uses: ./.github/workflows/deploy-supabase.yml
    with:
      run_ci: false
    secrets: inherit
