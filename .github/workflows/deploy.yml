name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ci:
        description: 'Run CI checks'
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Run CI
        run: npx nx affected -t lint test build types

  check-affected:
    needs: [ci]
    if: |
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      chatbots: ${{ steps.affected.outputs.chatbots }}
      db: ${{ steps.affected.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Determine affected projects
        id: affected
        run: |
          AFFECTED=$(npx nx show projects --affected --json | jq -r '.[]' 2>/dev/null || echo "")

          if echo "$AFFECTED" | grep -q "^api$"; then
            echo "api=true" >> $GITHUB_OUTPUT
          else
            echo "api=false" >> $GITHUB_OUTPUT
          fi

          if echo "$AFFECTED" | grep -q "^chatbots$"; then
            echo "chatbots=true" >> $GITHUB_OUTPUT
          else
            echo "chatbots=false" >> $GITHUB_OUTPUT
          fi

          if echo "$AFFECTED" | grep -q "^db$"; then
            echo "db=true" >> $GITHUB_OUTPUT
          else
            echo "db=false" >> $GITHUB_OUTPUT
          fi

          echo "Affected projects:"
          echo "  api: $(echo "$AFFECTED" | grep -q "^api$" && echo "yes" || echo "no")"
          echo "  chatbots: $(echo "$AFFECTED" | grep -q "^chatbots$" && echo "yes" || echo "no")"
          echo "  db: $(echo "$AFFECTED" | grep -q "^db$" && echo "yes" || echo "no")"

  deploy-api:
    needs: check-affected
    if: needs.check-affected.outputs.api == 'true'
    uses: ./.github/workflows/deploy-api.yml
    with:
      run_ci: false
    secrets: inherit

  deploy-chatbots:
    needs: check-affected
    if: needs.check-affected.outputs.chatbots == 'true'
    uses: ./.github/workflows/deploy-chatbots.yml
    with:
      run_ci: false
    secrets: inherit

  deploy-db:
    needs: check-affected
    if: needs.check-affected.outputs.db == 'true'
    uses: ./.github/workflows/deploy-supabase.yml
    with:
      run_ci: false
    secrets: inherit
