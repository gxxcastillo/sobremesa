name: Deploy Supabase Schema

on:
  workflow_call:
    inputs:
      run_ci:
        description: 'Run CI checks'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_ci:
        description: 'Run CI checks'
        type: boolean
        default: true

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

jobs:
  ci:
    if: ${{ inputs.run_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Run CI for DB
        run: bun nx run-many -t lint test build types --projects=db

  deploy:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ env.SUPABASE_PROJECT_ID }}
        working-directory: apps/db

      - name: Preview migrations
        run: supabase db push --dry-run
        working-directory: apps/db

      - name: Deploy database migrations
        run: supabase db push
        working-directory: apps/db

      - name: Verify deployment
        run: supabase migration list
        working-directory: apps/db

      # Under the single-migration policy (apps/db/README.md), schema edits
      # fold into the already-applied init migration, so `db push` has
      # nothing to apply and still succeeds. Diffing the hosted schema
      # against the migrations is what catches that. An in-sync project
      # writes no file.
      - name: Verify hosted schema matches migrations
        run: |
          supabase db diff --linked --schema public -f deploy_drift_check
          drift=$(ls supabase/migrations/*_deploy_drift_check.sql 2>/dev/null || true)
          if [ -n "$drift" ]; then
            echo "::error::Hosted schema differs from supabase/migrations. Under the single-migration policy, reset the hosted project (apps/db/README.md, Migration policy)."
            cat $drift
            exit 1
          fi
        working-directory: apps/db
