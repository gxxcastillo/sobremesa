name: Deploy Chatbots

on:
  workflow_call:
    inputs:
      run_ci:
        description: 'Run CI checks'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_ci:
        description: 'Run CI checks'
        type: boolean
        default: true

jobs:
  ci:
    if: ${{ inputs.run_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Run CI for Chatbots
        run: npx nx run-many -t lint test build types --projects=chatbots

  deploy:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CHATBOTS_DEPLOY_TOKEN }}
        run: flyctl deploy --app sobremesa-chatbots --config apps/chatbots/fly.toml --dockerfile apps/chatbots/Dockerfile --remote-only
